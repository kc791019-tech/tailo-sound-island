<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3e8"><title>臺羅聲音探險</title><style>body{margin:0;padding:24px;font:16px system-ui,sans-serif;color:#183b3a;background:#f4f3e8}p{max-width:36rem;margin:20vh auto;text-align:center;line-height:1.6}</style></head><body><p id="status">正在載入《臺羅聲音探險》…</p><script>
(async()=>{try{if(!('DecompressionStream'in window))throw new Error('請更新 iOS/Safari 後再開啟');const r=await fetch('./game.gz?v=832876a9f2e2');if(!r.ok)throw new Error('載入題庫失敗（'+r.status+'）');const bytes=new Uint8Array(await r.arrayBuffer());const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').textContent='遊戲載入失敗：'+e.message}})();
</script></body></html>
